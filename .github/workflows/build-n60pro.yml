name: Build ImmortalWrt MT798X Firmware

on:
  # 手动触发
  workflow_dispatch:
  # 推送到 main/master 分支时触发，可按需调整分支名
  push:
    branches:
      - main
      - master
  # 也可按需开启定时构建
  # schedule:
  #   - cron: '0 0 * * 0'  # 每周日零点构建

env:
  # 指定使用 openwrt-24.10-6.6 分支（MT798X 24.10 适配分支）
  REPO_BRANCH: openwrt-24.10-6.6
  # 编译配置文件路径（相对于仓库根目录）
  DEFCONFIG_FILE: defconfig/mt7975-ipailna-high-power.config
  # 最终固件输出目录
  BIN_DIR: bin/targets

jobs:
  build:
    runs-on: ubuntu-22.04
    # 超时设为 6 小时，避免编译时间过长被强制终止
    timeout-minutes: 360

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          # 由于仓库默认分支可能与目标分支不同，显式指定分支
          ref: ${{ env.REPO_BRANCH }}
          # 拉取完整历史，避免 shallow clone 导致的部分问题
          fetch-depth: 0

      - name: Free disk space
        run: |
          # 释放一些磁盘空间，避免构建时空间不足
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev \
            libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip \
            python3-ply python3-docutils python3-pyelftools qemu-utils \
            re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Restore ccache cache
        uses: actions/cache@v4
        with:
          path: .ccache
          # 使用分支名和配置文件名的组合作为缓存 key，当分支或配置变化时自动失效
          key: ccache-${{ env.REPO_BRANCH }}-${{ env.DEFCONFIG_FILE }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.REPO_BRANCH }}-${{ env.DEFCONFIG_FILE }}-
            ccache-${{ env.REPO_BRANCH }}-

      - name: Restore dl cache (source tarballs)
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ env.REPO_BRANCH }}-${{ github.sha }}
          restore-keys: |
            dl-${{ env.REPO_BRANCH }}-
            dl-

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy defconfig
        run: |
          # 将指定的 defconfig 复制为 .config
          cp ${{ env.DEFCONFIG_FILE }} .config

      - name: Enable required plugins (config adjustment)
        run: |
          # 只写本分支(openwrt-24.10)源里真实存在的包符号；写错的名字会被 make defconfig
          # 静默丢弃 —— 之前的 luci-app-adguardhome / luci-app-mosdns 就属于这种情况（源里没有）。
          # 已验证存在：luci-app-openclash(0.47.156) luci-app-mwan3 mwan3
          #             adguardhome(0.107.57) mosdns(5.3.3) dnsmasq-full
          echo "CONFIG_PACKAGE_luci-app-mwan3=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-base=y" >> .config
          echo "CONFIG_PACKAGE_mwan3=y" >> .config
          echo "CONFIG_PACKAGE_adguardhome=y" >> .config
          echo "CONFIG_PACKAGE_mosdns=y" >> .config
          # OpenClash 依赖 dnsmasq-full：若选中了基础版 dnsmasq，换成 full
          sed -i 's/^CONFIG_PACKAGE_dnsmasq=y/# CONFIG_PACKAGE_dnsmasq is not set/' .config
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          make defconfig

      - name: Verify target + package selection (fail fast)
        run: |
          echo "--- selected target/subtarget ---"
          grep -E '^CONFIG_TARGET_mediatek(_[a-z0-9]+)?=y' .config || true
          echo "--- selected devices ---"
          grep -E '^CONFIG_TARGET_DEVICE_.*=y' .config || true
          fail=0
          for sym in \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro \
            CONFIG_PACKAGE_luci-app-openclash \
            CONFIG_PACKAGE_luci-app-mwan3 \
            CONFIG_PACKAGE_adguardhome \
            CONFIG_PACKAGE_mosdns \
            CONFIG_PACKAGE_dnsmasq-full ; do
            if grep -q "^${sym}=y" .config; then echo "  OK       ${sym}"; else echo "  MISSING  ${sym}"; fail=1; fi
          done
          [ "$fail" = 0 ] || { echo "::error::关键配置未生效，终止编译"; exit 1; }

      - name: Download all sources
        run: |
          # 预下载所有源码包，利用 dl 缓存加速
          make download -j$(nproc)
          # 检查下载是否完整
          find dl -size 0 -delete

      - name: Build firmware
        run: |
          # 开启 ccache 加速编译
          export PATH="/usr/lib/ccache:$PATH"
          # 使用所有 CPU 核心编译，-j$(nproc) 可根据实际核心数调整
          make -j$(nproc) V=s

      - name: Prepare firmware artifacts
        run: |
          # 创建 artifacts 目录，用于存放待上传的固件文件
          mkdir -p artifacts
          # 查找编译生成的固件文件（sysupgrade 和 factory 镜像）
          find ${{ env.BIN_DIR }} -name "*.bin" -o -name "*.img" -o -name "*.itb" \
            -o -name "profiles.json" -o -name "sha256sums" -o -name "*.manifest" | \
            while read file; do
              cp "$file" artifacts/
            done
          # 同时复制编译日志和构建信息，便于排查问题
          cp .config artifacts/config.log || true
          cp .config.old artifacts/config.old.log || true
          # 额外收集 iwinfo 相关 ipk：便于不刷机、单独替换路由器上的 libiwinfo/iwinfo 来验证修复
          find bin/packages -name "libiwinfo*.ipk" -o -name "iwinfo_*.ipk" | while read f; do
            cp "$f" artifacts/ || true
          done
          find ${{ env.BIN_DIR }} -name "*.txt" -exec cp {} artifacts/ \; || true
          # 生成文件清单
          ls -la artifacts/ > artifacts/filelist.txt

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-mt798x-firmware
          path: artifacts/
          # 保留 30 天，可按需调整
          retention-days: 30
          # 若文件较多，可启用压缩
          # compression-level: 6

      - name: Save ccache stats
        run: |
          ccache -s
