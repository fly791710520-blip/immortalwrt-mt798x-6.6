name: Netcore N60Pro 高功率24.10(纯净版)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc
          docker rmi $(docker images -q) || true

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache libelf-dev libncurses5-dev libssl-dev python3

      - name: 更新 feeds（仅使用源码自带源）
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载高功率配置 + 启用插件
        run: |
          cp defconfig/mt7975-ipailna-high-power.config .config
          
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981_DEVICE_mediatek_mt7981-netcore-n60-pro=y" >> .config
          
          echo "CONFIG_PACKAGE_luci-app-adguardhome=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-mosdns=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-istore=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-istoreui=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-oaf=y" >> .config
          
          make defconfig

      - name: 开始编译
        run: |
          make -j4 V=s

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-n60pro
          path: bin/targets/mediatek/mt7981/
