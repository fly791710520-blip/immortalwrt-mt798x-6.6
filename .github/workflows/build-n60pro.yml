name: Build ImmortalWrt MT798X High-Power Firmware

# 触发条件：推送main分支、手动触发workflow、PR
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  DEFCONFIG_FILE: defconfig/mt7975-ipailna-high-power.config
  TMP_FOLDER: openwrt
  CACHE_KEY: mt798x-24.10-${{ github.sha }}

jobs:
  compile:
    runs-on: ubuntu-22.04
    steps:
      - name: 基础系统依赖安装
        run: |
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget ccache
      - name: 克隆源码仓库
        run: |
          git clone ${{ env.REPO_URL }} ${{ env.TMP_FOLDER }}
          cd ${{ env.TMP_FOLDER }}
          git checkout main
      - name: 缓存编译目录（加速二次编译）
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.TMP_FOLDER }}/dl
            ${{ env.TMP_FOLDER }}/build_dir
            ${{ env.TMP_FOLDER }}/staging_dir
            ~/.ccache
          key: ${{ env.CACHE_KEY }}
          restore-keys: mt798x-24.10-
      - name: 进入源码目录并初始化Feeds
        run: |
          cd ${{ env.TMP_FOLDER }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: 加载高功率配置模版并追加插件开关
        run: |
          cd ${{ env.TMP_FOLDER }}
          # 复制高功率默认配置为 .config
          cp ${{ env.DEFCONFIG_FILE }} .config
          # 开启所需LuCI插件及完整依赖
          echo "CONFIG_PACKAGE_luci-app-mwan3=y" >> .config
          echo "CONFIG_PACKAGE_mwan3=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-adguardhome=y" >> .config
          echo "CONFIG_PACKAGE_adguardhome=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-mosdns=y" >> .config
          echo "CONFIG_PACKAGE_mosdns=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
          echo "CONFIG_PACKAGE_openclash=y" >> .config
          # 自动补齐所有依赖，消除缺失依赖报错
          make defconfig
      - name: 预下载全部源码包（防止编译中途断流）
        run: |
          cd ${{ env.TMP_FOLDER }}
          make download -j$(nproc)
      - name: 开启CCache加速编译
        run: |
          echo "CCACHE_DIR=~/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=10G" >> $GITHUB_ENV
      - name: 多线程编译固件
        run: |
          cd ${{ env.TMP_FOLDER }}
          make -j$(nproc) V=s
      - name: 打包固件产物
        run: |
          cd ${{ env.TMP_FOLDER }}/bin/targets/mt798x/mt7985
          zip -r firmware-mt7975-highpower.zip ./*.bin ./*.json ./*.img
      - name: 上传固件至Actions制品
        uses: actions/upload-artifact@v4
        with:
          name: MT7975-HighPower-Firmware
          path: ${{ env.TMP_FOLDER }}/bin/targets/mt798x/mt7985/firmware-mt7975-highpower.zip
          retention-days: 30
