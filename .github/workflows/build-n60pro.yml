name: Netcore N60Pro 高功率24.10(全插件版)-最终稳定版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false

    steps:
      - name: 检出 ImmortalWrt 源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          docker rmi $(docker images -q) -f || true
          sudo apt clean
          df -h

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses-dev \
          libssl-dev unzip python3 python3-setuptools wget \
          python3-distutils rsync subversion swig time xsltproc zlib1g-dev \
          quilt libfuse-dev

      # ===== 镜像修复：仅保留可靠源 =====
      - name: 修复下载脚本（仅用阿里云和官方主源）
        run: |
          # 备份
          cp scripts/download.pl scripts/download.pl.bak
          # 移除所有已知失效镜像
          sed -i "/mirror2\.immortalwrt\.org/d" scripts/download.pl
          sed -i "/mirror\.ox\.ac\.uk/d" scripts/download.pl
          # 在第一个镜像前插入阿里云镜像（优先级最高）
          sed -i "0,/push @mirrors, 'https:\/\/sources.immortalwrt.org'/s//push \@mirrors, 'https:\/\/mirrors.aliyun.com\/immortalwrt\/sources';\n&/" scripts/download.pl
          echo "当前镜像列表："
          grep 'push @mirrors' scripts/download.pl

      # ===== 预下载所有已知易失效的源码包 =====
      - name: 预下载关键源码包
        run: |
          mkdir -p dl
          # 函数：尝试多源下载
          download_src() {
            local FILENAME=$1
            local URLS=$2
            for url in $URLS; do
              echo "尝试下载 $FILENAME 从 $url"
              wget -c --timeout=20 -O "dl/${FILENAME}" "$url" && return 0
            done
            return 1
          }

          # gnulib
          download_src "gnulib-c99c8d491850dc3a6e0b8604a2729d8bc5c0eff1.tar.gz" \
            "https://mirrors.aliyun.com/immortalwrt/sources/gnulib-c99c8d491850dc3a6e0b8604a2729d8bc5c0eff1.tar.gz \
             https://sources.immortalwrt.org/gnulib-c99c8d491850dc3a6e0b8604a2729d8bc5c0eff1.tar.gz \
             https://github.com/coreutils/gnulib/archive/c99c8d491850dc3a6e0b8604a2729d8bc5c0eff1.tar.gz"

          # libressl (3.7.3)
          download_src "libressl-3.7.3.tar.gz" \
            "https://mirrors.aliyun.com/immortalwrt/sources/libressl-3.7.3.tar.gz \
             https://sources.immortalwrt.org/libressl-3.7.3.tar.gz \
             https://ftp.openbsd.org/pub/OpenBSD/LibreSSL/libressl-3.7.3.tar.gz \
             https://cdn.openbsd.org/pub/OpenBSD/LibreSSL/libressl-3.7.3.tar.gz"

          # 如果有其他文件，可继续添加...
          echo "预下载完成"

      # ===== feeds 配置 =====
      - name: 配置 feeds
        run: |
          if [ ! -f feeds.conf ]; then
            cp feeds.conf.default feeds.conf 2>/dev/null || touch feeds.conf
          fi

          echo "src-git istoreui https://github.com/linkease/istore-ui.git;main" >> feeds.conf
          echo "src-git appfilter https://github.com/destan19/OpenAppFilter.git;master" >> feeds.conf

      - name: 更新并安装全部 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ===== 缓存加速 =====
      - name: 设置 ccache
        uses: hendrikmuhs/ccache-action@v1.2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          key: n60pro-immortalwrt
          max-size: 500M

      - name: 缓存源码包
        uses: actions/cache@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          path: dl
          key: ${{ runner.os }}-dl-${{ hashFiles('feeds.conf', 'feeds.conf.default') }}-v4
          restore-keys: |
            ${{ runner.os }}-dl-

      # ===== 配置固件 =====
      - name: 加载高功率模板并启用全部插件
        run: |
          if [ ! -f defconfig/mt7975-ipailna-high-power.config ]; then
            echo "::error::找不到 defconfig/mt7975-ipailna-high-power.config"
            exit 1
          fi
          cp defconfig/mt7975-ipailna-high-power.config .config

          cat >> .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7981=y
          CONFIG_TARGET_mediatek_mt7981_DEVICE_mediatek_mt7981-netcore-n60-pro=y
          EOF

          cat >> .config <<EOF
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-i18n-adguardhome-zh-cn=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-mosdns=y
          CONFIG_PACKAGE_luci-i18n-mosdns-zh-cn=y
          CONFIG_PACKAGE_luci-app-istoreui=y
          CONFIG_PACKAGE_luci-i18n-quickstart-zh-cn=y
          CONFIG_PACKAGE_luci-app-oaf=y
          CONFIG_PACKAGE_luci-i18n-oaf-zh-cn=y
          EOF

          make defconfig

          # 强制启用可能被禁用的插件
          for pkg in luci-app-adguardhome luci-app-openclash luci-app-mosdns luci-app-istoreui luci-app-oaf; do
            if ! grep -q "CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "⚠️ $pkg 被禁用，强制重新启用"
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
            else
              echo "✅ $pkg 已启用"
            fi
          done

          # dnsmasq 冲突处理
          if grep -q "CONFIG_PACKAGE_dnsmasq=y" .config; then
            sed -i 's/CONFIG_PACKAGE_dnsmasq=y/# CONFIG_PACKAGE_dnsmasq is not set/' .config
            echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          fi

      # ===== 编译（保留完整日志） =====
      - name: 编译固件
        id: compile
        run: |
          make -j2 V=s 2>&1 | tee build_log.txt
        continue-on-error: true

      # ===== 上传日志 =====
      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_log.txt
            .config

      # ===== 编译成功则上传固件 =====
      - name: 上传固件
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-n60pro-full
          path: bin/targets/mediatek/mt7981/
