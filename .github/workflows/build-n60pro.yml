name: Netcore N60Pro 高功率24.10(全插件版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false

    steps:
      - name: 检出 ImmortalWrt 源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ===== 1. 磁盘 + 依赖 =====
      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          docker rmi $(docker images -q) -f || true
          sudo apt clean
          df -h

      - name: 安装编译依赖（适配 Ubuntu 22.04）
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses-dev \
          libssl-dev unzip python3 python3-setuptools wget \
          python3-distutils rsync subversion swig time xsltproc zlib1g-dev \
          quilt libfuse-dev

      # ===== 2. feeds 与插件集成（优化版） =====
      - name: 添加自定义 feeds
        run: |
          if [ ! -f feeds.conf ]; then
            cp feeds.conf.default feeds.conf 2>/dev/null || touch feeds.conf
          fi

          echo "src-git istoreui https://github.com/linkease/istore-ui.git;main" >> feeds.conf
          echo "src-git appfilter https://github.com/destan19/OpenAppFilter.git;master" >> feeds.conf

      - name: 更新并安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 集成插件 (OpenClash, MosDNS)
        run: |
          # 1. 集成 OpenClash (vernesong/OpenClash)
          git clone --depth 1 https://github.com/vernesong/OpenClash.git /tmp/openclash-temp
          mkdir -p package/luci-app-openclash
          cp -r /tmp/openclash-temp/luci-app-openclash/* package/luci-app-openclash/
          rm -rf /tmp/openclash-temp
          
          # 安装 OpenClash 依赖
          ./scripts/feeds install dnsmasq-full
          ./scripts/feeds install bash curl ca-bundle ipset ip-full ruby ruby-yaml unzip
          ./scripts/feeds install iptables kmod-ipt-nat iptables-mod-tproxy iptables-mod-extra
          ./scripts/feeds install kmod-tun luci-compat kmod-inet-diag kmod-nft-tproxy

          # 2. 集成 MosDNS (sbwml/luci-app-mosdns)
          # 解决冲突：移除 ImmortalWrt 自带的旧版 mosdns 和 v2ray-geodata
          rm -rf ./feeds/packages/net/mosdns
          rm -rf ./feeds/packages/net/v2ray-geodata
          
          # 更新 Golang 版本（MosDNS 依赖高版本 Golang）
          rm -rf feeds/packages/lang/golang
          git clone https://github.com/sbwml/packages_lang_golang -b 24.x feeds/packages/lang/golang
          
          # 克隆 sbwml 维护的 MosDNS 和配套 geodata
          git clone https://github.com/sbwml/luci-app-mosdns -b v5 package/mosdns
          git clone https://github.com/sbwml/v2ray-geodata package/v2ray-geodata
          
          # 安装 MosDNS 依赖
          ./scripts/feeds install mosdns
          ./scripts/feeds install v2ray-geodata

      # ===== 3. 缓存加速 =====
      - name: 设置 ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: n60pro-immortalwrt
          max-size: 500M

      - name: 缓存下载的源码包
        uses: actions/cache@v4
        with:
          path: dl
          key: ${{ runner.os }}-dl-${{ hashFiles('feeds.conf', 'feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-dl-

      # ===== 4. 配置固件 =====
      - name: 加载高功率模板并启用全部插件
        run: |
          if [ ! -f defconfig/mt7975-ipailna-high-power.config ]; then
            echo "::error::找不到 defconfig/mt7975-ipailna-high-power.config"
            exit 1
          fi
          cp defconfig/mt7975-ipailna-high-power.config .config

          # 锁定机型
          cat >> .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7981=y
          CONFIG_TARGET_mediatek_mt7981_DEVICE_mediatek_mt7981-netcore-n60-pro=y
          EOF

          # 启用全部插件（包含中文语言包）
          cat >> .config <<EOF
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-i18n-adguardhome-zh-cn=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-mosdns=y
          CONFIG_PACKAGE_luci-i18n-mosdns-zh-cn=y
          CONFIG_PACKAGE_luci-app-istoreui=y
          CONFIG_PACKAGE_luci-i18n-quickstart-zh-cn=y
          CONFIG_PACKAGE_luci-app-oaf=y
          CONFIG_PACKAGE_luci-i18n-oaf-zh-cn=y
          # 常用依赖
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_kmod-ipt-nat=y
          CONFIG_PACKAGE_iptables-mod-tproxy=y
          CONFIG_PACKAGE_iptables-mod-extra=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_mosdns=y
          CONFIG_PACKAGE_v2ray-geodata=y
          EOF

          # 展开依赖
          make defconfig

          # ===== 最终检查与强制修复 =====
          echo "::group::检查插件状态并强制修复"
          # 检查并强制启用 AdGuardHome
          if ! grep -q "CONFIG_PACKAGE_luci-app-adguardhome=y" .config; then
            echo "::warning::luci-app-adguardhome 未启用，强制修复中..."
            echo "CONFIG_PACKAGE_luci-app-adguardhome=y" >> .config
            
            # 直接通过 package 目录强制集成（备用方案）
            if [ ! -d "package/luci-app-adguardhome" ]; then
              echo "::warning::从 feeds 安装 AdGuardHome..."
              ./scripts/feeds install luci-app-adguardhome
              ./scripts/feeds install adguardhome
              ./scripts/feeds install luci-i18n-adguardhome-zh-cn
            fi
          fi

          # 检查其他关键插件并启用
          for pkg in luci-app-openclash luci-app-mosdns luci-app-istoreui luci-app-oaf; do
            if ! grep -q "CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "::warning::${pkg} 未启用，强制修复中..."
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
            fi
          done

          # 最终验证
          echo "::group::最终验证所有插件状态"
          all_enabled=true
          for pkg in luci-app-adguardhome luci-app-openclash luci-app-mosdns luci-app-istoreui luci-app-oaf; do
            if grep -q "CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "✅ $pkg 已启用"
            else
              echo "❌ $pkg 仍然未启用！"
              all_enabled=false
            fi
          done
          
          # 如果仍有未启用的插件，不中断编译，但给出严重警告
          if [ "$all_enabled" = false ]; then
            echo "::warning::部分插件未能成功启用，将继续编译，但可能无法正常工作"
          else
            echo "✅ 所有插件检查通过！"
          fi
          echo "::endgroup::"
          echo "::endgroup::"

      # ===== 5. 编译 =====
      - name: 开始编译（稳定2线程）
        run: |
          make -j2 V=s

      # ===== 6. 上传固件 =====
      - name: 上传完整固件
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-n60pro-full
          path: bin/targets/mediatek/mt7981/
