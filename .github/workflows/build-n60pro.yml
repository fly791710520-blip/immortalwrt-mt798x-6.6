name: Netcore N60Pro 高功率24.10(调试版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false

    steps:
      - name: 检出 ImmortalWrt 源码
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          docker rmi $(docker images -q) -f || true
          sudo apt clean
          df -h

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses-dev \
          libssl-dev unzip python3 python3-setuptools wget \
          python3-distutils rsync subversion swig time xsltproc zlib1g-dev \
          quilt libfuse-dev

      - name: 准备 feeds（仅使用官方源）
        run: |
          if [ ! -f feeds.conf ]; then
            cp feeds.conf.default feeds.conf
          fi
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 配置固件（仅启用基础插件）
        run: |
          # 检查高功率配置文件是否存在
          if [ ! -f defconfig/mt7975-ipailna-high-power.config ]; then
            echo "::error::找不到 defconfig/mt7975-ipailna-high-power.config"
            exit 1
          fi
          cp defconfig/mt7975-ipailna-high-power.config .config

          # 锁定机型
          cat >> .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7981=y
          CONFIG_TARGET_mediatek_mt7981_DEVICE_mediatek_mt7981-netcore-n60-pro=y
          EOF

          # 启用我们的全部5个插件
          cat >> .config <<EOF
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-mosdns=y
          CONFIG_PACKAGE_luci-app-istoreui=y
          CONFIG_PACKAGE_luci-app-oaf=y
          EOF

          # 展开依赖，并将输出保存到文件以供检查
          make defconfig 2>&1 | tee $GITHUB_WORKSPACE/defconfig_log.txt

      - name: 编译固件（详细日志，忽略缓存）
        run: |
          # -j2: 稳定2线程编译，避免内存不足
          # V=s: 输出非常详细的编译日志
          # 将标准输出和标准错误都重定向到日志文件，同时在控制台显示
          make -j2 V=s 2>&1 | tee $GITHUB_WORKSPACE/build_log.txt
        # 注意：如果 make 命令返回非0状态码，GitHub Actions 会自动标记此步骤为失败。
        # 但我们可以通过 tee 命令确保所有输出都已被记录到 build_log.txt 文件。

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ github.workspace }}/build_log.txt
            ${{ github.workspace }}/defconfig_log.txt
            .config
