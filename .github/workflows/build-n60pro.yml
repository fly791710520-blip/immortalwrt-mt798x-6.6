name: Netcore N60Pro 高功率24.10(全插件版)-稳定版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false

    steps:
      - name: 检出 ImmortalWrt 源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          docker rmi $(docker images -q) -f || true
          sudo apt clean
          df -h

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses-dev \
          libssl-dev unzip python3 python3-setuptools wget \
          python3-distutils rsync subversion swig time xsltproc zlib1g-dev \
          quilt libfuse-dev

      # ===== 关键修复：替换失效的下载镜像 =====
      - name: 修复下载镜像源
        run: |
          # 备份原始文件
          cp scripts/download.pl scripts/download.pl.bak
          
          # 注释掉失效的 mirror2 (HTTP 400)
          sed -i "s|push @mirrors, 'https://mirror2.immortalwrt.org/sources'|# push \@mirrors, 'https://mirror2.immortalwrt.org/sources'|" scripts/download.pl
          
          # 在镜像列表最前面插入阿里云镜像（优先级最高）
          sed -i "/push \@mirrors, 'https:\/\/sources.immortalwrt.org'/a push \@mirrors, 'https://mirrors.aliyun.com/immortalwrt/sources';" scripts/download.pl
          
          echo "已修复镜像列表，当前顺序："
          grep "push @mirrors" scripts/download.pl

      # ===== 预下载缺失的源码包 =====
      - name: 预下载源码包 (gnulib)
        run: |
          mkdir -p dl
          FILE="gnulib-c99c8d491850dc3a6e0b8604a2729d8bc5c0eff1.tar.gz"
          
          # 多个备用源，直到下载成功
          for url in \
            "https://mirrors.aliyun.com/immortalwrt/sources/${FILE}" \
            "https://sources.immortalwrt.org/${FILE}" \
            "https://github.com/coreutils/gnulib/archive/c99c8d491850dc3a6e0b8604a2729d8bc5c0eff1.tar.gz" \
            "https://mirror.sjtu.edu.cn/immortalwrt/sources/${FILE}"
          do
            echo "尝试从 $url 下载..."
            wget -c --timeout=20 -O "dl/${FILE}" "$url" && break
            echo "从 $url 下载失败，尝试下一个..."
          done
          
          if [ ! -f "dl/${FILE}" ] || [ $(stat -c%s "dl/${FILE}") -lt 1000 ]; then
            echo "::warning::gnulib 下载失败，将尝试在编译时自动获取"
          else
            echo "✅ gnulib 预下载成功"
          fi

      # ===== feeds 配置（仅添加必需的外部源） =====
      - name: 配置 feeds
        run: |
          if [ ! -f feeds.conf ]; then
            cp feeds.conf.default feeds.conf 2>/dev/null || touch feeds.conf
          fi

          echo "src-git istoreui https://github.com/linkease/istore-ui.git;main" >> feeds.conf
          echo "src-git appfilter https://github.com/destan19/OpenAppFilter.git;master" >> feeds.conf

      - name: 更新并安装全部 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ===== 缓存加速（Node.js 24 兼容） =====
      - name: 设置 ccache
        uses: hendrikmuhs/ccache-action@v1.2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          key: n60pro-immortalwrt
          max-size: 500M

      - name: 缓存源码包
        uses: actions/cache@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          path: dl
          key: ${{ runner.os }}-dl-${{ hashFiles('feeds.conf', 'feeds.conf.default') }}-v3
          restore-keys: |
            ${{ runner.os }}-dl-

      # ===== 配置固件 =====
      - name: 加载高功率模板并启用全部插件
        run: |
          if [ ! -f defconfig/mt7975-ipailna-high-power.config ]; then
            echo "::error::找不到 defconfig/mt7975-ipailna-high-power.config"
            exit 1
          fi
          cp defconfig/mt7975-ipailna-high-power.config .config

          cat >> .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7981=y
          CONFIG_TARGET_mediatek_mt7981_DEVICE_mediatek_mt7981-netcore-n60-pro=y
          EOF

          cat >> .config <<EOF
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-i18n-adguardhome-zh-cn=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-mosdns=y
          CONFIG_PACKAGE_luci-i18n-mosdns-zh-cn=y
          CONFIG_PACKAGE_luci-app-istoreui=y
          CONFIG_PACKAGE_luci-i18n-quickstart-zh-cn=y
          CONFIG_PACKAGE_luci-app-oaf=y
          CONFIG_PACKAGE_luci-i18n-oaf-zh-cn=y
          EOF

          make defconfig

          # 强制启用可能被禁用的插件
          for pkg in luci-app-adguardhome luci-app-openclash luci-app-mosdns luci-app-istoreui luci-app-oaf; do
            if ! grep -q "CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "⚠️ $pkg 被禁用，强制重新启用"
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
            else
              echo "✅ $pkg 已启用"
            fi
          done

          # 解决 dnsmasq 冲突
          if grep -q "CONFIG_PACKAGE_dnsmasq=y" .config; then
            sed -i 's/CONFIG_PACKAGE_dnsmasq=y/# CONFIG_PACKAGE_dnsmasq is not set/' .config
            echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          fi

      # ===== 编译（使用修复后的下载源） =====
      - name: 编译固件
        id: compile
        run: |
          make -j2 V=s 2>&1 | tee build_log.txt
        continue-on-error: true

      # ===== 上传日志（无论成功与否） =====
      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_log.txt
            .config
            scripts/download.pl

      # ===== 如果编译成功，上传固件 =====
      - name: 上传固件
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-n60pro-full
          path: bin/targets/mediatek/mt7981/
